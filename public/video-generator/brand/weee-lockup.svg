<?xml version="1.0" encoding="UTF-8"?>
<!--
  Weee :) full lockup, adapted for the dark UI. Two changes from the supplied art,
  both deliberate:

  1. The `ink` gradient (the wordmark and the smile) ran #292c31 -> #1f2227 — near
     black, correct for the original white presentation and completely invisible on
     this app's #07060c canvas. It now runs off-white, matching --text-primary
     (#f1eefa). Nothing else about the wordmark changed: same paths, same stroke
     weights, same kerning.
  2. viewBox tightened from "0 0 1600 800" to the art's own bounds. The original left
     roughly a third of the canvas empty, so at the sidebar's 38px cap the lockup
     rendered about half the size it should.

  If a light-background version is ever needed (an invoice, an email header), copy
  this file and put the original two ink stops back — do not add a runtime theme
  switch, the app is dark-only by design.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="450" viewBox="60 180 1540 450" role="img" aria-labelledby="title desc">
  <title id="title">Weee full logo</title>
  <desc id="desc">Glassmorphic play and ribbon symbol with a bold custom Weee smile wordmark.</desc>
  <defs>
    <linearGradient id="glass" x1="210" y1="160" x2="650" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".52" stop-color="#eaf0ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#cfdcff" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="220" y1="160" x2="650" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#aabfff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="95" y1="380" x2="710" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a662f5"/>
      <stop offset=".30" stop-color="#794af2"/>
      <stop offset=".60" stop-color="#5575f4"/>
      <stop offset="1" stop-color="#5ce4f1"/>
    </linearGradient>
    <linearGradient id="ribbonSoft" x1="130" y1="390" x2="670" y2="585" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ba70fa" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#6475f7" stop-opacity=".64"/>
      <stop offset="1" stop-color="#68e5f3" stop-opacity=".76"/>
    </linearGradient>
    <!-- Off-white ink for the dark canvas; see the note at the top of this file. -->
    <linearGradient id="ink" x1="640" y1="330" x2="1515" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f3fd"/>
      <stop offset=".55" stop-color="#ded8ef"/>
      <stop offset="1" stop-color="#f6f3fd"/>
    </linearGradient>
  </defs>

  <g id="symbol" transform="translate(26 102) scale(.72)">
    <path
      d="M247 159
         C222 144 202 160 202 189
         L202 630
         C202 666 231 684 260 666
         L667 423
         C694 406 694 375 666 358
         Z"
      fill="url(#glass)"
      stroke="url(#glassEdge)"
      stroke-width="3.5"
      stroke-linejoin="round"/>

    <path
      d="M93 392
         C173 270 265 326 347 428
         C386 477 425 508 474 503
         C544 495 568 382 648 365
         C672 360 694 363 711 371
         C660 413 629 521 530 555
         C458 580 385 566 324 528
         C236 472 189 344 93 392
         Z"
      fill="url(#ribbonSoft)"
      opacity=".78"/>

    <path
      d="M93 392
         C178 261 268 345 348 438
         C389 485 426 506 474 501
         C544 492 570 385 650 367
         C673 362 696 365 711 373
         C655 362 621 429 572 474
         C532 511 490 527 449 522
         C366 512 309 400 239 363
         C189 337 140 344 93 392
         Z"
      fill="url(#ribbon)"
      stroke="#ffffff"
      stroke-opacity=".66"
      stroke-width="3"
      stroke-linejoin="round"/>

    <path
      d="M95 392
         C179 262 268 346 348 438
         C388 484 426 506 474 501
         C545 493 571 385 650 367"
      fill="none"
      stroke="#ffffff"
      stroke-opacity=".72"
      stroke-width="3"
      stroke-linecap="round"/>

    <path
      d="M239 363
         C308 400 365 512 449 522
         C492 527 534 510 573 474"
      fill="none"
      stroke="#dffcff"
      stroke-opacity=".40"
      stroke-width="2.2"
      stroke-linecap="round"/>
  </g>

  <g id="wordmark" fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Custom bold capital W -->
    <path d="M630 310 L685 510 L755 360 L825 510 L880 310" stroke-width="58"/>

    <!-- Three tightly kerned custom e characters -->
    <g stroke-width="38">
      <path d="M1060 425
               C1056 383 1028 365 997 370
               C957 376 940 410 946 444
               C953 483 988 498 1022 489
               C1039 485 1052 476 1060 464
               M946 425 H1056"/>
      <path d="M1220 425
               C1216 383 1188 365 1157 370
               C1117 376 1100 410 1106 444
               C1113 483 1148 498 1182 489
               C1199 485 1212 476 1220 464
               M1106 425 H1216"/>
      <path d="M1380 425
               C1376 383 1348 365 1317 370
               C1277 376 1260 410 1266 444
               C1273 483 1308 498 1342 489
               C1359 485 1372 476 1380 464
               M1266 425 H1376"/>
    </g>

    <!-- Friendly emoticon, matched to the wordmark -->
    <g stroke="none" fill="url(#ink)">
      <circle cx="1442" cy="392" r="15"/>
      <circle cx="1442" cy="462" r="15"/>
    </g>
    <path d="M1502 358 C1546 390 1546 464 1502 500" stroke-width="28"/>
  </g>
</svg>
